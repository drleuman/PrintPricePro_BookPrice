<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Book Price Calculator</title>

  <!-- Strict CSP for security -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' 'unsafe-eval' https://aistudiocdn.com;
    style-src  'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.tailwindcss.com;
    font-src   'self' https://fonts.gstatic.com;
    connect-src 'self' https://aistudiocdn.com https://printprice.pro;
    img-src 'self' data: https:;
    worker-src 'self' blob:;
    frame-ancestors 'self';
    base-uri 'self'; form-action 'self'; upgrade-insecure-requests;
  ">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom CSS for transitions -->
  <link rel="stylesheet" href="./index.css">

  <!-- SystemJS and Babel Standalone CDNs -->
  <script src="https://aistudiocdn.com/systemjs/system.min.js"></script>
  <script src="https://aistudiocdn.com/@babel/standalone/babel.min.js"></script>

  <!-- Import Map for SystemJS -->
  <script type="systemjs-importmap">
    {
      "imports": {
        "react": "https://aistudiocdn.com/react/18.3.1/umd/react.production.min.js",
        "react/jsx-runtime": "https://aistudiocdn.com/react/18.3.1/umd/react-jsx-runtime.production.min.js",
        "react-dom/client": "https://aistudiocdn.com/react-dom/18.3.1/umd/react-dom.production.min.js",
        "pdfjs-dist": "https://aistudiocdn.com/pdfjs-dist/4.4.168/build/pdf.min.mjs",
        "pdfjs-dist/build/pdf.worker.min.mjs": "https://aistudiocdn.com/pdfjs-dist/4.4.168/build/pdf.worker.min.mjs",
        "@heroicons/react/20/solid": "https://aistudiocdn.com/@heroicons/react/2.2.0/20/solid/index.js",
        "@heroicons/react/24/outline": "https://aistudiocdn.com/@heroicons/react/2.2.0/24/outline/index.js"
      }
    }
  </script>

  <!-- Custom SystemJS Babel Loader Hook -->
  <script type="systemjs-module" src="./loader/systemjs-babel-loader.ts"></script>

  <!-- Bootstrap the React app -->
  <script type="systemjs-module">
    System.import('./index.tsx').then(module => {
      // console.log('App loaded successfully');
    }).catch(err => {
      console.error('Failed to load app:', err);
    });
  </script>
<script type="importmap">

  }
}
</script>
